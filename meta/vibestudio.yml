defaultAgentConfig:
  model: openai-codex:gpt-6-sol
extensions:
  - source: extensions/browser-data
providers:
  browserData:
    extension: extensions/browser-data
services:
  - action: use browser history, bookmarks, downloads, and preferences
    authority:
      binding: declared
      principals:
        - host
        - user
        - code
    description: Access your browser history, bookmarks, downloads, and saved preferences.
    durableObject:
      className: BrowserDataDO
    name: browser.data
    notability: everyday
    presentation:
      domain: web
      verb: see
    protocols:
      - vibestudio.browser-data.v1
    source: workers/browser-data
    title: Browser data
  - action: use the tour’s fictional reading-list sample
    authority:
      principals:
        - host
        - code
    description: A read-only sample for trying real capability approvals. No personal data or external services.
    durableObject:
      className: TourSample
    name: tour-sample
    notability: everyday
    presentation:
      domain: files
      verb: see
    protocols:
      - vibestudio.tour-sample.v1
    source: workers/tour-sample
    title: Tour sample
systemEpoch: 0
template:
  dependencies:
    - url: git+https://github.com/panticonic/vibestudio-base.git
    - url: git+https://github.com/panticonic/vibestudio-system-testing.git
  description: Your private projects, browsing and personal work.
  name: Personal
  repositories:
    - about/bookmarks
    - about/browser-import-inspector
    - about/collection
    - about/credentials
    - about/downloads
    - about/history
    - about/local-models
    - about/permissions
    - about/search
    - extensions/browser-data
    - meta
    - packages/collection-orchestration
    - panels/tour
    - skills/automations
    - skills/github
    - skills/memory
    - skills/onboarding
    - workers/browser-data
    - workers/explorer-agent
    - workers/tour-sample
